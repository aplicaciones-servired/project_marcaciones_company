services:
  web_marcaciones:
    image: nginx:stable-alpine3.21-perl
    restart: always
    container_name: web_marcaciones
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
    networks:
      - red-gane-int

  api_marcaciones:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: api-marcaciones
    restart: always
    image: api-marca-v1.0
    networks:
      - red-gane-int
    environment:
      - TZ=America/Bogota
      - PORT=${PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - CORS_ORIGINS=${CORS_ORIGINS}
      
networks:
  red-gane-int:
    external: true
